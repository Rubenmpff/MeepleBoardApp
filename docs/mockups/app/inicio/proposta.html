body{margin:0;background:#EDEBF0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--ink);padding:32px 16px 64px}
.page{display:flex;flex-wrap:wrap;gap:40px;justify-content:center}
figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center}
figcaption{display:flex;flex-direction:column;align-items:center;font-size:14px;color:var(--mut)}

.phone{position:relative;width:402px;height:874px;background:var(--bg);overflow:hidden;border-radius:44px;box-shadow:0 0 0 1px #D9D4DE}

.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 34px 0 54px;font-weight:600;font-size:17px;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#0E0C10;z-index:31}
.batt{width:27px;height:13px;border:1.6px solid var(--ink);border-radius:4px;position:relative}.batt:after{content:"";position:absolute;inset:2px;background:var(--ink);border-radius:1.5px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:8px;z-index:12;font-size:11px;font-weight:600;color:var(--mut)}
.tabbar>span{display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar>span.on{color:var(--pri)}
.new{width:52px;height:34px;border-radius:12px;background:var(--pri);display:flex;align-items:center;justify-content:center}
.body{position:absolute;left:0;right:0;top:0;padding:62px 20px 110px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:600}
h1{margin:4px 0 0;font-size:24px;line-height:30px;font-weight:700}
h2{margin:0;font-size:17px;line-height:22px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between}
.more{font-size:14px;font-weight:600;color:var(--pri)}
.hero{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;line-height:16px;font-weight:600}
.dot{width:8px;height:8px;border-radius:4px;background:var(--pri)}
.ttl{font-size:20px;line-height:26px;font-weight:700}
.cap{font-size:13px;line-height:18px;color:var(--mut)}
.btns{display:flex;gap:10px;align-items:center}
.btn{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;padding:0 16px}
.btn.fill{background:var(--pri);color:#fff;flex:1}
.btn.soft{background:#fff;color:var(--pri);border:1px solid var(--line)}
.btn.text{color:var(--pri);padding:0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:60px}
.row+.row{border-top:1px solid var(--hair)}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.cover{width:44px;height:44px;border-radius:10px;background:var(--hero);display:flex;align-items:center;justify-content:center;flex:none}
.date{width:40px;display:flex;flex-direction:column;align-items:center;line-height:1;flex:none}
.date i{font-style:normal;font-size:11px;font-weight:700;color:var(--friend);text-transform:uppercase}
.date b{font-size:20px;margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--pendSoft);color:var(--pendText)}
.year{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:20px;color:var(--mut);padding:2px 2px}
.year b{color:var(--ink)}
.year span:last-child{font-weight:600;color:var(--pri);display:flex;align-items:center;gap:2px;white-space:nowrap}
.note{max-width:900px;margin:0 auto 28px;font-size:14px;line-height:20px;color:var(--mut);text-align:center}
